# Checks every pull request against the rules in docs/publishing.md ("The checks"); tools/pr-checks.mjs runs them
# all and lists each one. The token can only read, and no secret reaches this workflow.
name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    # The app is macOS only; the tools are tested where it runs (the package test unpacks with ditto, as the app does).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/pr-checks.mjs --base "origin/$BASE_REF"
