# Checks every pull request against the rules in docs/publishing.md ("The checks") with the pull request's own code:
# npm ci --ignore-scripts, then the static rules, build, validate, its tests, the tools' tests, the docs and a catalog.
# The pull request can change this file and everything it runs, so its result shows a contributor what to fix and
# helps the review; it guarantees nothing. The checks no pull request can change are in static.yml. The token can only
# read, and no secret reaches this workflow. Actions are pinned to full commit SHAs.
name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    # The app is macOS only; the tools are tested where it runs (the package test unpacks with ditto, as the app does).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # No install script runs: not the libraries', not a workspace's own.
      - run: npm ci --ignore-scripts
      - name: Run the checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/pr-checks.mjs --base "origin/$BASE_REF"
