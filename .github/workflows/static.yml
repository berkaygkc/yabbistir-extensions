# The static checks of every pull request (docs/publishing.md, "The checks"): the rules that read files and git only,
# applied by the base branch's own checker to the pull request's commits as data.
#   - pull_request_target runs this file as it is on the base branch, so a pull request cannot change this job. The
#     token can read the repository and set commit statuses, nothing more; no secret is used, nothing is installed and
#     no cache is restored.
#   - The checker is three files of the base branch's last commit (github.sha, the commit this file was read from), and
#     uses Node's built-in modules only, on the runner's own Node.
#   - The pull request's commits are fetched into pr/, and the checker reads them through git (git ls-tree, git
#     cat-file, git diff) at the pull request's head commit: nothing in pr/ is run, imported or read from disk.
#   - A pull request that touches .github/, tools/, packages/, templates/, schema/, the root package.json,
#     package-lock.json (beyond one extension's own libraries) or tsconfig.json, or a .gitattributes, fails here: such
#     a change is the maintainer's own, merged past this check on purpose.
#   - It runs for pull requests to main only. The result is posted as the commit status store/static-checks on the
#     pull request's head commit, success only when the checker exited 0. Branch protection requires that status: a workflow a pull request from a fork adds
#     runs with a read-only token and cannot set a commit status, while it could name a job "Static checks".
# Actions are pinned to full commit SHAs.
name: Static checks

on:
  pull_request_target:
    # Pull requests to main only, the branch whose protection requires the status: a run against another base
    # branch would judge the head commit by another diff.
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: static-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The checker: these three files of the base branch, and nothing else of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: checker
          sparse-checkout: |
            /tools/lockfile-state.mjs
            /tools/static-checks.mjs
            /tools/lib/static-rules.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The pull request, as data: its commits, which the checker reads through git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Static checks
        id: checker
        env:
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=0
          node checker/tools/static-checks.mjs --root pr --base "$BASE_SHA" --head "$HEAD_SHA" || code=$?
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      # Always, even when a step before failed or the run was cancelled: anything but a checker that ran and exited 0
      # posts failure. It reads the checker's result only; nothing of the pull request. And for a pull request to main
      # only, whatever the trigger above says.
      - name: Post the commit status
        if: always() && github.event.pull_request.base.ref == 'main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTCOME: ${{ steps.checker.outcome }}
          EXIT_CODE: ${{ steps.checker.outputs.exit-code }}
        with:
          script: |
            const passed = process.env.OUTCOME === "success" && process.env.EXIT_CODE === "0";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: passed ? "success" : "failure",
              context: "store/static-checks",
              description: passed ? "The static checks passed." : "The static checks failed: the run lists why.",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
