# Publishes the store on every push to main, in three jobs:
#   build    checks the install state (tools/lockfile-state.mjs) before installing anything, then builds every
#            extension and writes the catalog, unsigned; it has no secret and no environment
#   sign     the only job with the signing key (the publish environment): it checks out tools/sign.mjs and the app's
#            public keys and nothing else, never runs npm, and signs the catalog the build job made
#   deploy   publishes the signed site/ to GitHub Pages from the github-pages environment
# Actions are pinned to full commit SHAs.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The catalog dates each extension by main's commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Before anything is installed: what main's lockfile would install, and the files npm and the build would read.
      - run: node tools/lockfile-state.mjs
      - run: npm ci --ignore-scripts
      # node itself, not npm run, which would put node_modules/.bin first on PATH.
      - run: node tools/catalog.mjs --out site/v1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign the catalog
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      contents: read
    steps:
      # These two paths and nothing else: no package.json, no node_modules, no other code of the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /tools/sign.mjs
            /keys/catalog-public-keys.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      # The runner's own Node: sign.mjs uses Node's built-in modules only.
      - name: Sign
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: node tools/sign.mjs site/v1/catalog.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: sign
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
