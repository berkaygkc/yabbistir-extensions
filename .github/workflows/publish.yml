# Publishes the store on every push to main: builds every extension, writes the catalog, signs it with the key only
# the publish environment holds, and deploys site/ to GitHub Pages. The job that holds the key installs without
# install scripts and cannot deploy; the job that deploys never sees the key.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign the catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Each extension's updatedAt is the time of the last commit that changed its folder.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and sign the catalog
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: npm run catalog -- --out site/v1 --sign-key-env CATALOG_SIGNING_KEY
      - name: Require the signature
        run: |
          if [ ! -s site/v1/catalog.json.sig ]; then
            echo "::error::site/v1/catalog.json.sig is missing: the publish environment has no CATALOG_SIGNING_KEY secret, and the app accepts only a signed catalog."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
